[project]
name = "tbx-cli"
version = "0.0.1"
description = "Placeholder for the tbx CLI toolbox. The real release follows."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"

[project.urls]
Repository = "https://github.com/joeblackwaslike/toolbox"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tbx_cli"]
