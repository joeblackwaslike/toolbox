[project]
name = "tbx-workspace"
version = "0.0.0"
description = "Python workspace root for the tbx toolbox"
requires-python = ">=3.12,<4.0"
dependencies = ["tbx-shared"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["shared/py"]

[tool.uv.sources]
tbx-shared = { workspace = true }

[dependency-groups]
dev = [
    "mypy>=1.18",
    "pytest>=8.4",
    "pytest-mock>=3.15",
    "ruff>=0.14",
]

[tool.mypy]
strict = true
disallow_any_unimported = true
warn_unreachable = true
show_error_codes = true

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
# typer 0.25.1 imports Click helpers that Click 9 removes; drop this when typer is upgraded.
filterwarnings = [
    "ignore:'click\\.utils\\.get_(binary|text)_stream' is deprecated:DeprecationWarning:typer",
]
testpaths = ["tests", "tools", "shared/py"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "A", "B", "C4", "C90", "COM", "D", "DTZ", "E", "ERA", "EXE", "F", "FBT", "FLY", "FURB",
    "G", "I", "ICN", "ISC", "LOG", "N", "PERF", "PIE", "PL", "PT", "PTH", "Q", "RET", "RSE",
    "RUF", "S", "SIM", "SLF", "SLOT", "T100", "TRY", "UP", "W", "YTT",
]
ignore = [
    "A005", "COM812", "D100", "D104", "D106", "D203", "D212", "D401", "D404", "D405",
    "E501", "E731", "ISC001", "ISC003", "PLR09", "PLR2004", "PLR6301", "TRY003",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-quotes]
inline-quotes = "double"

[tool.ruff.lint.mccabe]
max-complexity = 24

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]
"**/tests/**/*.py" = ["S101", "S105", "S404", "S603", "S607", "D103"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
