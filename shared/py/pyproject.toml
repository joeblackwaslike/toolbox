[project]
name = "tbx-shared"
version = "0.1.0"
description = "Shared runtime helpers for Python tbx tools"
requires-python = ">=3.12,<4.0"
dependencies = [
    "click>=8.1,<9",
    "rich>=13.7",
    "tenacity>=8.5",
    "typer>=0.12,<0.26",
]

[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["tbx_shared"]

[tool.setuptools.package-data]
tbx_shared = ["py.typed"]
